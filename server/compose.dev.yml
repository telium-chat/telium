name: telium-dev

services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: telium-dev
      MINIO_ROOT_PASSWORD: telium-dev-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - telium-dev-minio:/data

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: telium
      POSTGRES_PASSWORD: telium-dev-secret
      POSTGRES_DB: telium
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - telium-dev-postgres:/var/lib/postgresql/data

  nats:
    image: nats:2.10
    command: -js
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

volumes:
  telium-dev-minio:
  telium-dev-postgres:
