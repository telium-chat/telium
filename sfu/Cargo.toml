[package]
name = "telium-sfu"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Telium SFU front: auth gateway + control translator over LiveKit"

[[bin]]
name = "telium-sfu"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros", "form"] }
tower-http = { version = "0.6", features = ["cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "fs", "net", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
url = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
base64 = "0.22"
rand = "0.8"
anyhow = "1"
thiserror = "2"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
argon2 = "0.5"
telium-protocol = { path = "../telium-protocol" }
