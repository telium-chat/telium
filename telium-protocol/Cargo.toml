[package]
name = "telium-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
description = "Shared Telium signing/verification primitives (signed JSON, Ed25519)"

[dependencies]
ed25519-dalek = { version = "2", features = ["pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Link-button and card URLs are parsed rather than pattern-matched: the rule is
# "https, no embedded credentials", and a regex that approximates that is a
# regex that eventually accepts `https://evil.example\@good.example`.
url = "2"

[dev-dependencies]
# Property testing for the signing/canonicalisation core. These functions are
# the trust boundary for every federated document in the project, and they are
# reached by bytes a stranger chose; table-driven cases only ever cover the
# shapes someone thought of.
proptest = "1"
