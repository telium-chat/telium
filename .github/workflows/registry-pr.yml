name: Registry listings

# The /list wizard on the site files a prefilled issue with the `directory`
# label; this workflow turns that issue into a one-entry pull request and
# comments the link back. The registry's rules stay in the validators, which
# run inside the script and again on the pull request itself — the bot adds
# none of its own.
#
# The 'directory' label has to exist before the first listing arrives; GitHub
# does not create labels named in issue forms. The script identifies the listing
# kind from its JSON identity, as markdown form elements are not submitted.
#
# If REGISTRY_BOT_TOKEN is configured, the resulting PR triggers CI normally.
# Otherwise, GitHub requires a maintainer to approve workflow runs on PRs
# created with GITHUB_TOKEN. See site/registry/README.md for the one-time setup.
#
# One listing run at a time: two overlapping issues would each commit against
# the same registry file. The runs are short; queueing is free.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: registry
  cancel-in-progress: false

jobs:
  listing:
    if: contains(github.event.issue.labels.*.name, 'directory')
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` below names a commit, not a tag. A tag is a mutable
      # pointer that the action's owner -- or anyone who takes their account
      # -- can move onto new code, and this repository's runs would then
      # execute it without a diff, a review, or a notification. The trailing
      # comment is the release that commit was, so the pin is still readable;
      # `docs/supply-chain.md` explains how to move one forward.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The script decides everything worth knowing — kind, identity, whether
      # the entry is acceptable — so the workflow stays a thin shell around
      # three exits: 0 commit, 3 duplicate, anything else report and leave the
      # issue open for a resubmission.
      - name: Read the issue and prepare the entry
        id: entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue view "${{ github.event.issue.number }}" --json body --jq .body > issue-body.md
          set +e
          node site/scripts/registry-issue.mjs \
            --body-file issue-body.md \
            --created "${{ github.event.issue.created_at }}" \
            > entry.log 2>&1
          code=$?
          cat entry.log
          echo "exit=$code" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.entry.outputs.exit == '0'
        env:
          # A narrowly scoped PAT (or GitHub App token) makes bot-created
          # pull requests trigger CI without manual approval. The fallback is
          # still functional but GitHub requires maintainer CI approval.
          GH_TOKEN: ${{ secrets.REGISTRY_BOT_TOKEN || github.token }}
          NUMBER: ${{ github.event.issue.number }}
          IDENTITY: ${{ steps.entry.outputs.identity }}
          TITLE: ${{ steps.entry.outputs.title }}
        run: |
          git config user.name  'telium-registry'
          git config user.email 'telium-registry@users.noreply.github.com'
          BRANCH="registry/${{ steps.entry.outputs.kind }}-${{ steps.entry.outputs.slug }}-$NUMBER"
          git checkout -b "$BRANCH"
          git add site/registry/
          git commit -m "list: $IDENTITY (#$NUMBER)"
          # A probe commit may have landed while this run was working; rebase
          # rather than force, so the repository's own commits survive.
          git pull --rebase --autostash origin main
          git push origin "$BRANCH"

          cat > pr-body.md <<'EOF'
          From listing issue #ISSUE_NUMBER (Closes #ISSUE_NUMBER).

          The entry was built by `site/scripts/registry-issue.mjs` from the issue's fields: the JSON is allowlist-rebuilt, the `added` date is stamped from the issue, and the recommendations/feed consent switch is read from the checkbox alone. The validator ran on it already and will run again here, alongside the advisory live probe.

          Nothing here is urgent. When it merges, the hourly probe starts building the entry's uptime history, and the recommendation/feed gates apply on their own schedule from that history.
          EOF
          sed -i "s/ISSUE_NUMBER/$NUMBER/g" pr-body.md

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body-file pr-body.md)

          gh issue comment "$NUMBER" \
            --body "Opened the listing as $TITLE: $PR_URL — CI validates and probes the server (a maintainer may need to approve workflow runs if no bot token is configured). A maintainer merges after validation; the listing goes live at the next site build."

      - name: Close as a duplicate
        if: steps.entry.outputs.exit == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file entry.log
          gh issue close "$NUMBER" --reason "not planned"

      - name: Report the failure
        if: steps.entry.outputs.exit != '0' && steps.entry.outputs.exit != '3'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUMBER" --body-file entry.log
          gh issue comment "$NUMBER" --body "The listing was not applied, and this issue stays open — fix what the message above names and resubmit through [telium.chat/list](https://telium.chat/list), or ask here and someone will help."
