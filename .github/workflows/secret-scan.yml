name: Secret scan

# Looks for credentials in a pull request before GitHub's own scanner is
# switched on.
#
# Why this exists at all, given that GitHub has a scanner
# -------------------------------------------------------
# `docs/supply-chain.md` §7–§8 and the release checklist both
# ask the owner to turn on secret scanning and push protection. Both are right,
# and neither has been done, and neither *can* be done from a branch: they are
# account settings, and on a private repository owned by an organization --
# which this is, on both counts -- they additionally require GitHub Advanced
# Security, which is a purchase. So the single highest-value control in that
# area is off, was off the whole time both documents described it, and nothing
# in the tree could have told you.
#
# This job is the floor under that gap, not a replacement for it. Push
# protection refuses the push, which is the only mechanism that *prevents* a
# leak rather than reporting one; GitHub's partner patterns are validated
# against the issuing provider, which no offline scanner can do. When GHAS is
# turned on, both checklist items stay, and this job keeps earning its place on
# the half GitHub will never cover: Telium's own secrets -- the federation
# signing key, `voice.turn_secret`, `mail.webhook_token`,
# `metrics.scrape_token`, a backup encryption key -- are long random strings
# with no issuer and no prefix, and no vendor has a rule for a config format
# they have never heard of. `scripts/secret-scan.mjs` has the full argument,
# including why this is a purpose-built scanner rather than gitleaks (whose
# action requires a paid license for organization accounts) or trufflehog
# (whose distinguishing feature is sending every candidate string to a third
# party to see whether it works).
#
# What it scans, and why the second half is the point
# ----------------------------------------------------
#   * the working tree, and
#   * every blob introduced by every commit in the pull request, including
#     blobs a later commit deleted.
#
# A secret committed and removed in the next commit is still in the pack file,
# still in every clone, and still leaked -- deleting the line changes nothing
# about whether it has to be rotated. A scanner that reads only the checkout
# reports green on precisely that case, which is the case that matters, so the
# checkout gets `fetch-depth: 0` and the scan walks `base..head` itself.
#
# Note what is NOT here: a `paths:` filter on the trigger.
#
# It would be the obvious way to write "only run when a file changed", and it
# would make this workflow permanently unusable as a required check. GitHub
# does not report a skipped-by-path-filter workflow as a passing check; it
# reports nothing at all, and a branch rule waiting for a check that never
# arrives blocks the pull request forever with no red X to explain it.
# `docs/supply-chain.md` is the long version. There is also nothing worth
# filtering: the tree scan is under a second and the history scan of this
# repository's entire 1,544-commit history is under a minute, so a filter would
# save nothing and could only ever be wrong -- and the change this gate exists
# to catch can appear in any file at all, including a documentation page
# quoting a config sample.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Keep this job name stable: it is a check branch protection should require.
  # See `docs/supply-chain.md` for the argument and the checklist
  # that has not been applied yet. Renaming it is a change to a branch ruleset
  # made in a file that cannot see the branch ruleset.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Every `uses:` below names a commit, not a tag, like the other 73 in
      # this repository. `docs/supply-chain.md` §2 explains why and how to move
      # one forward.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole point. Without the history there is no history to scan,
          # and the job silently degrades into a checkout grep. The runner is
          # persistent, so this is one deep fetch ever and an incremental one
          # after that.
          fetch-depth: 0

      # The scanner is dependency-free Node, deliberately: tooling whose job is
      # to be suspicious should not itself be a supply-chain event. It still
      # needs a Node on PATH, which a self-hosted runner does not have merely
      # because JavaScript actions bring their own runtime.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Before the scan, not after, and not optional.
      #
      # A secret scanner fails silently by construction. Break a regex and the
      # job still exits zero and still prints "No unexplained credentials
      # found" -- the log of a working scanner over a clean tree and the log of
      # a broken scanner over a leaking one are the same log. There is no
      # natural signal that the rules still work, so the signal is manufactured
      # here: the suite builds throwaway git repositories, commits dead
      # fixtures into them, and asserts the scanner exits non-zero on the ones
      # it must catch and zero on the near-miss it must not. It takes about
      # three seconds. If it ever fails, the finding is that this gate has
      # stopped being a gate, which is more urgent than anything it could have
      # reported.
      - name: Prove the scanner still fires
        run: node --test scripts/secret-scan.test.mjs

      - name: Work out which commits this pull request added
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail

          # Fails open, always, and "open" here means the entire history.
          #
          # This is affordable in a way it is not for the other gates: the full
          # walk is 1,544 commits in under a minute, so the cost of an
          # uncertain diff is a minute of runner time. The cost of guessing the
          # other way is a false green on the one control whose failures cannot
          # be undone after the fact -- a credential that reached this remote
          # must be rotated whatever happens next. There is no version of that
          # trade where "probably nothing" is the right answer.
          scan_everything() {
            echo "$1 -- scanning the whole history"
            echo "range=HEAD" >> "$GITHUB_OUTPUT"
            exit 0
          }

          case "$EVENT" in
            pull_request)
              [ -n "${PR_BASE_SHA:-}" ] || scan_everything "no PR base commit"
              [ -n "${PR_HEAD_SHA:-}" ] || scan_everything "no PR head commit"
              git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null \
                || scan_everything "PR base is not in this clone"
              git cat-file -e "$PR_HEAD_SHA^{commit}" 2>/dev/null \
                || scan_everything "PR head is not in this clone"
              echo "range=$PR_BASE_SHA..$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
              echo "scanning the commits this pull request adds"
              ;;
            push)
              # `github.event.before` is all zeros when a branch is created,
              # and names a commit that is gone after a force push. Either way
              # the honest answer is the whole history rather than a range that
              # silently covers nothing.
              case "${PUSH_BEFORE:-}" in
                ''|0000000000000000000000000000000000000000)
                  scan_everything "no previous commit for this push" ;;
              esac
              git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null \
                || scan_everything "the previous commit is not in this clone"
              echo "range=$PUSH_BEFORE..$PUSH_AFTER" >> "$GITHUB_OUTPUT"
              echo "scanning the commits this push adds"
              ;;
            *)
              # A dispatched run is somebody asking the whole question on
              # purpose. This is the on-demand full sweep: it is the only way
              # to re-examine history after a rule is added, since a pull
              # request only ever sees its own commits.
              scan_everything "dispatched run" ;;
          esac

      # Both halves in one invocation so the report is one list rather than two
      # that have to be reconciled. On a hit the job exits non-zero and names
      # the rule, the path, the line, the commit and a SHA-256 of the matched
      # text -- never the text itself. A CI log is a place a secret gets copied
      # to; it is not a place to publish one a second time, and the digest is
      # all an operator needs to identify the value locally or to write an
      # allowlist entry for it.
      - name: Look for credentials
        run: node scripts/secret-scan.mjs --tree --range "${{ steps.range.outputs.range }}"
