name: Diagnose deployed receiver routing

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-receiver.yml'
      - 'web/src/lib/handoff.js'
      - 'web/src/lib/routing.js'
      - 'site/public/_redirects'
      - 'web/src/sw.js'

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - name: Examine production URL responses without cookies or credentials
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          for path in ('/receive-move', '/receive-move/', '/channels/@me', '/app.html', '/sw.js'):
              url = 'https://telium.chat' + path
              opener = urllib.request.build_opener(type('NoRedirect', (urllib.request.HTTPRedirectHandler,), {'redirect_request': lambda self, req, fp, code, msg, headers, newurl: None})())
              try:
                  response = opener.open(urllib.request.Request(url, headers={'User-Agent': 'TeliumRouteProbe/1.0'}), timeout=12)
              except urllib.error.HTTPError as err:
                  response = err
              with response:
                  body = response.read(200000).decode('utf-8', errors='replace')
                  print(f'{path}: status={response.status}, location={response.headers.get("Location")}, type={response.headers.get("Content-Type")}, size={len(body)}, portal_marker={"telium-portal" in body}, client_root={"id=" + chr(34) + "root" + chr(34) in body}, marketing={"astro" in body.lower()}')
          PY
