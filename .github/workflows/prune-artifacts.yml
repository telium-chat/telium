name: Prune stale artifacts

# Artifact storage is a quota, not a bin that empties itself, and the job that
# finds out it is full is the one that had nothing to do with filling it: the
# AppImage build ran green for two minutes and then failed on its upload step
# with `Artifact storage quota has been hit`. That took 18GB -- a hundred and
# fifty 125MB AppImages, nearly all of them from three days of iterating on the
# same build, each kept for the fortnight the upload step asked for.
#
# `retention-days` is the first defence and it is enough for anything uploaded
# from here on. This is the second: it collects what retention was set too
# generously for, and what a workflow that has since been deleted or renamed
# left behind, where no retention setting can reach it any more.

on:
  schedule:
    # Weekly, at an odd minute. Every scheduled workflow on GitHub written as
    # `0 * * * *` fires into one queue and waits there for no reason but the
    # shape of the cron line.
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: prune-artifacts
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # Long enough that a build you are still looking at survives the sweep,
      # short enough that a week of iterating cannot fill the account.
      KEEP_DAYS: 7
    steps:
      - name: Delete artifacts past their welcome
        run: |
          cutoff="$(date -u -d "$KEEP_DAYS days ago" +%s)"

          gh api --paginate -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts" \
            -f per_page=100 \
            -q '.artifacts[] | select(.expired == false) | [.name, .created_at, .id, .size_in_bytes] | @tsv' \
            | sort -t$'\t' -k1,1 -k2,2r > /tmp/artifacts.tsv

          # The newest of each name is always kept, however old it is: a name
          # with one surviving build is a name you can still download, and a
          # sweep that leaves nothing behind is one you find out about by
          # needing the thing it deleted.
          last=''
          freed=0
          kept=0
          gone=0
          while IFS=$'\t' read -r name created id size; do
            if [ "$name" != "$last" ]; then
              last="$name"; kept=$((kept + 1)); continue
            fi
            if [ "$(date -u -d "$created" +%s)" -ge "$cutoff" ]; then
              kept=$((kept + 1)); continue
            fi
            if gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" >/dev/null; then
              gone=$((gone + 1)); freed=$((freed + size))
            fi
          done < /tmp/artifacts.tsv

          echo "Deleted $gone artifacts, freeing $((freed / 1048576))MB. Kept $kept."
          echo "Deleted **$gone** artifacts, freeing **$((freed / 1048576))MB**. Kept $kept." >> "$GITHUB_STEP_SUMMARY"
