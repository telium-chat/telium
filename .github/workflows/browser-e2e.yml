name: Browser E2E

on:
  pull_request:
    paths:
      - 'server/**'
      - 'sfu/**'
      - 'telium-protocol/**'
      - 'web/**'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chromium:
    # These short-lived stacks have deliberately-triggered Agent CI workflows.
    # Their synchronize events should not spend Actions minutes while fixes are
    # still being iterated on. Other PRs keep the repository's normal gate.
    if: >-
      github.event_name != 'pull_request' ||
      (github.head_ref != 'fix/verification-recovery-e2e' &&
       github.head_ref != 'fix/recovery-enrollment-reset-e2e')
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` below names a commit, not a tag. A tag is a mutable
      # pointer that the action's owner -- or anyone who takes their account
      # -- can move onto new code, and this repository's runs would then
      # execute it without a diff, a review, or a notification. The trailing
      # comment is the release that commit was, so the pin is still readable;
      # `docs/supply-chain.md` explains how to move one forward.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            server
            sfu
          cache-on-failure: true
      # Playwright is a Node tool and its CLI keeps a Node shebang, so the
      # runner still needs a Node to hand `bunx playwright` further down.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # setup-bun caches only the bun executable, so the package cache that
      # setup-node's `cache: npm` used to manage has to be its own step.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: Run web tests
        run: bun run test
        working-directory: web
      - run: bun add --no-save @playwright/test@1.55.0 @axe-core/playwright@4.10.2
        working-directory: web
      - run: bunx playwright install --with-deps chromium
        working-directory: web
      - run: cargo build --manifest-path server/Cargo.toml
      - name: Run server tests
        run: cargo test --manifest-path server/Cargo.toml --tests
      - name: Run SFU tests
        run: cargo test --manifest-path sfu/Cargo.toml --tests
      - name: Start Telium server
        run: |
          ./server/target/debug/telium-server --config /tmp/telium-e2e.toml serve >/tmp/telium-server.log 2>&1 &
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:8448/_telium/v1/health && exit 0
            sleep 1
          done
          cat /tmp/telium-server.log
          exit 1
      - name: Start web client
        run: |
          (cd web && TELIUM_ORIGIN=http://127.0.0.1:8448 bun run dev -- --host 127.0.0.1 >/tmp/telium-web.log 2>&1 &)
          for i in {1..60}; do
            curl -fsS http://127.0.0.1:5173/ && exit 0
            sleep 1
          done
          cat /tmp/telium-web.log
          exit 1
      - run: bunx playwright test e2e/smoke.spec.js
        working-directory: web
      - if: failure()
        run: |
          cat /tmp/telium-server.log || true
          cat /tmp/telium-web.log || true
