name: Agent CI

on:
  # Ordinary commits do not start this workflow. I run it by deliberately
  # updating .github/agent-ci-run, or it can be started manually from Actions.
  workflow_dispatch:
  push:
    branches:
      - fix/recovery-enrollment-reset-e2e
    paths:
      - '.github/agent-ci-run'

# Keyed on the branch rather than spelling one branch's name into the group.
# It only triggers on one branch today, so this is the same group it was -- but
# the moment a second name joins the list above, a hardcoded group would have
# the two branches cancelling each other for no reason anyone would think to
# look for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every `uses:` below names a commit, not a tag. A tag is a mutable
      # pointer that the action's owner -- or anyone who takes their account
      # -- can move onto new code, and this repository's runs would then
      # execute it without a diff, a review, or a notification. The trailing
      # comment is the release that commit was, so the pin is still readable;
      # `docs/supply-chain.md` explains how to move one forward.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
          cache-on-failure: true

      # Playwright is a Node tool and its CLI keeps a Node shebang, so the
      # runner still needs a Node to hand `bunx playwright` further down.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # setup-bun caches only the bun executable, so the package cache that
      # setup-node's `cache: npm` used to manage has to be its own step.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Web production build
        run: bun run build
        working-directory: web

      - name: Existing recovery server regression
        run: >-
          cargo test --manifest-path server/Cargo.toml --test api
          recovery_key_resets_opaque_password_and_preserves_identity -- --exact

      - name: Build server binary
        run: cargo build --manifest-path server/Cargo.toml

      - name: Install Playwright
        run: |
          bun add --no-save @playwright/test@1.55.0
          bunx playwright install --with-deps chromium
        working-directory: web

      - name: Write isolated E2E config
        run: |
          rm -f /tmp/telium-agent-ci.db
          rm -rf /tmp/telium-agent-ci-media
          cat >/tmp/telium-agent-ci.toml <<'EOF'
          server_name = "telium.local"
          public_base_url = "http://127.0.0.1:8448"
          bind = "127.0.0.1:8448"
          database_url = "sqlite:///tmp/telium-agent-ci.db?mode=rwc"
          media_dir = "/tmp/telium-agent-ci-media"

          [registration]
          open = true

          [backup]
          enabled = false
          EOF

      - name: Start Telium server
        run: |
          ./server/target/debug/telium-server --config /tmp/telium-agent-ci.toml serve >/tmp/telium-agent-ci-server.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8448/_telium/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/telium-agent-ci-server.log
          exit 1

      - name: Start web client
        run: |
          (cd web && TELIUM_ORIGIN=http://127.0.0.1:8448 bun run dev -- --host 127.0.0.1 >/tmp/telium-agent-ci-web.log 2>&1 &)
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/telium-agent-ci-web.log
          exit 1

      - name: Browser enrollment and password-reset flow
        run: bunx playwright test e2e/recovery-enrollment-reset.spec.js
        working-directory: web

      - name: Show service logs on failure
        if: failure()
        run: |
          echo '--- server ---'
          cat /tmp/telium-agent-ci-server.log || true
          echo '--- web ---'
          cat /tmp/telium-agent-ci-web.log || true
