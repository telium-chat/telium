name: CodeQL

on:
  pull_request:
    paths:
      - 'server/**'
      - 'web/**'
      - '.github/workflows/security-codeql.yml'
  schedule:
    - cron: '23 5 * * 2'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # The analysis runs and its log is readable, but uploading the results
    # requires GitHub Advanced Security, which a private repository does not
    # have — so this job fails at the upload step on every run, on main and
    # in PRs alike, whatever the code actually did. Advisory until that
    # changes: when the repository goes public (or Advanced Security is
    # enabled), delete this line and the gate returns to enforcing.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    runs-on: ubuntu-latest
    steps:
      # Every `uses:` below names a commit, not a tag. A tag is a mutable
      # pointer that the action's owner -- or anyone who takes their account
      # -- can move onto new code, and this repository's runs would then
      # execute it without a diff, a review, or a notification. The trailing
      # comment is the release that commit was, so the pin is still readable;
      # `docs/supply-chain.md` explains how to move one forward.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          languages: ${{ matrix.language }}
      - if: matrix.language == 'javascript-typescript'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      # setup-bun caches only the bun executable, so the package cache that
      # setup-node's `cache: npm` used to manage has to be its own step.
      - if: matrix.language == 'javascript-typescript'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - if: matrix.language == 'javascript-typescript'
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch @ 2026-09-03
      # The one `cargo build` in this repository that was building the server's
      # entire dependency tree from source on every run. Every other workflow
      # that compiles the server caches it; this one was written without the
      # line and nobody notices a slow job on a schedule, except that there is
      # one runner here and a scheduled job holds it exactly as hard as a job
      # somebody is waiting for.
      - if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server
      - if: matrix.language == 'rust'
        run: cargo build --manifest-path server/Cargo.toml
      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
