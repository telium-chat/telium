name: Bug report
description: Something in the client or on a server is broken.
labels: ['bug']
body:
  # The field labels here are headings in the issue that gets filed, and the
  # client writes reports against the same headings when it deep-links into
  # `issues/new` -- the crash screen fills "What I was doing" and "Error", the
  # feedback pane fills "What I was doing" and "What happened", both append
  # "Environment" and "Diagnostics". Renaming a label below silently orphans
  # the text those paths wrote, so treat a rename as a client change too
  # (web/src/lib/feedback.js, and the test that pins the match).
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this.

        Anything you paste here is public. The client's own diagnostics export
        (Settings → Connected servers → *Copy diagnostics*) is built so that it
        is safe to attach: it carries no messages, no names and no credentials.
        If you would rather not attach anything, leave that section out.

        Security problems go through private disclosure instead -- see
        [SECURITY.md](https://github.com/telium-chat/telium/blob/main/SECURITY.md).
  - type: textarea
    id: what-i-was-doing
    attributes:
      label: What I was doing
      description: What were you doing when it went wrong, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What actually happened instead? If something showed an error, paste it.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >
        Client: the Build line from the footer of the settings screen. Server:
        the output of `telium-server version`, the OS and CPU (`uname -a`),
        and whether it runs in a container or under systemd.
      placeholder: |
        - Build: `0.1.0 · 1a2b3c4 · desktop · 2026-01-01T00:00:00Z`
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >
        Optional, and genuinely read. The output of the client's
        *Copy diagnostics* button, already shaped for a public issue.
  # Blank issues stay enabled (config.yml) for the reports that fit no template.
