# A reverse proxy in front of a Telium homeserver, for nginx.
#
# Copy the server block, change the two names, point it at wherever the server
# is listening, and you are done. There is nothing clever in here and there
# should not be: every line below exists because leaving it out breaks
# something specific, and the specific thing is written next to it.
#
# This assumes the shape docs/production.md recommends: the server bound to
# 127.0.0.1:8448, TLS terminated here, one name for everything. If you split
# the client onto a second name, `web.client_url` in the server config is how
# the server learns about it.

# Rate limits are defined at http{} scope, so these two go in the main config
# (or a file in conf.d/) rather than inside a server block.
#
# This is a second line of defence and not the first. The server has its own
# limiter that understands what a request *is* -- a sign-in is not a message
# send is not a media upload -- and this one only counts requests per address.
# It is here for the case the server's limiter cannot help with: a flood large
# enough that the cost is in accepting the connection at all.
limit_req_zone $binary_remote_addr zone=telium_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=telium_auth:10m rate=2r/s;

# WebSocket upgrades. `Connection` is a hop-by-hop header, so it has to be
# rewritten per request rather than passed through: a plain `proxy_set_header
# Connection $http_connection` works until a client sends something nginx
# forwards verbatim and the upgrade silently does not happen.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # The name in user ids and the name clients actually connect to. Usually
    # the same; if they are not, this is the second one -- see `public_base_url`
    # in the server config, and the delegation document at
    # /.well-known/telium/server which the first name must serve.
    server_name telium.example.org;

    ssl_certificate     /etc/letsencrypt/live/telium.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/telium.example.org/privkey.pem;

    # The server sets its own security headers (server/src/security_headers.rs)
    # and they are chosen to match what the client actually needs. Do not add a
    # second Content-Security-Policy here: two policies are intersected, not
    # merged, and the usual result is a client that half-loads with no error
    # anybody can see.

    # Big enough for the largest thing an upload can be, plus room for the
    # multipart envelope around it. `media_policy.max_file_bytes` defaults to
    # 100 MB; if you raise it, raise this, or uploads fail at the proxy with a
    # 413 the server never sees and cannot explain.
    client_max_body_size 128m;

    # An upload is a slow request by nature and a phone on a train is a slow
    # client. These are generous on purpose: the failure they prevent is a
    # 90-second upload cut off at 60 seconds, every time, for the same user.
    client_body_timeout 300s;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8448;
        proxy_http_version 1.1;

        # The WebSocket gateway lives on the same listener as everything else,
        # so the upgrade has to survive on every path rather than on one.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # THE ONE THAT MATTERS: the server only believes X-Forwarded-For from
        # addresses listed in `rate_limit.trusted_proxies`. Put this proxy's
        # address there. Without it every request in the world is attributed to
        # this machine, which means the rate limiter is counting one client
        # with all of the traffic -- so either nothing is ever limited, or
        # everything is at once. There is no middle behaviour and no error
        # message; it simply does the wrong thing quietly.

        # A gateway connection is idle between heartbeats, which are 45 seconds
        # apart (HEARTBEAT_INTERVAL_MS in server/src/gateway/mod.rs). nginx's
        # default read timeout is 60 seconds, which is above 45 and below two
        # missed beats -- close enough to the wire that a slow moment drops
        # live connections for no reason the logs will ever show. Well clear of
        # it instead.
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;

        # Buffering is what makes a proxy good at serving files and bad at
        # serving events. With it on, nginx accumulates the response before
        # passing it along, and a stream of small gateway frames arrives in
        # clumps -- typing indicators that land three seconds late, messages
        # that appear in batches.
        proxy_buffering off;

        limit_req zone=telium_api burst=60 nodelay;
    }

    # Sign-in and registration, held to a much tighter rate than the rest.
    # Password guessing is the attack this shape of endpoint gets, and it is
    # cheap to mount and expensive to absorb. The server limits these too; this
    # is the part that happens before the server is involved at all.
    location ~ ^/_telium/v1/auth/ {
        proxy_pass http://127.0.0.1:8448;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        limit_req zone=telium_auth burst=10 nodelay;
    }

    # Federation. Other servers reach this path, and they are not browsers: a
    # slow peer on the other side of the world is normal, and a bundle import
    # is a large body signed as a whole. Left on the same generous timeouts as
    # everything else rather than given tighter ones that look tidier.
    location /_telium/v1/federation/ {
        proxy_pass http://127.0.0.1:8448;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 128m;
    }
}

# Plain HTTP exists only to send people to the other one. It answers the ACME
# challenge and redirects everything else; it never proxies to the server,
# because a homeserver reachable over http is a homeserver whose tokens and
# federation traffic can be read by anybody on the path.
server {
    listen 80;
    listen [::]:80;
    server_name telium.example.org;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
