# How this box updates itself. Installed at /opt/telium/update.conf and read by
# update.sh on every run.
#
# The defaults below are the defaults in the script as well, so a box with no
# such file behaves exactly like a box with this one unedited. It is installed
# anyway, because a setting you can see is a setting you can change, and the
# most important line in this file is the first one: it says, in a field with a
# name, that this machine updates itself. An operator who wants something else
# has to write down what.
#
# Shell syntax -- update.sh sources it. Keep it to KEY=value.


# automatic | manual
#
# `automatic` pulls the current release and restarts the server container when
# the image moves. `manual` checks, says what it found, and does nothing; you
# run `/opt/telium/update.sh --now` when you are ready.
#
# Choose `manual` if you want to read release notes before every deploy. Be
# aware of what you are taking on: nothing else will apply a security fix for
# you, and the server will start telling you how long it has been since it was
# current. That is the point -- staying behind should be a thing you keep
# deciding, not a thing that happens while you are busy.
TELIUM_UPDATES=automatic


# Empty, or an exact image reference to hold this box at.
#
#   TELIUM_PIN=sha256:0f4c...          (a digest -- this is the useful form)
#   TELIUM_PIN=ghcr.io/telium-chat/telium@sha256:0f4c...
#
# A pin is applied as a compose override, so compose.yml itself is left alone
# and clearing this line is all it takes to follow the channel again. While a
# pin is set, every run of update.sh says so, and the server itself keeps
# counting the releases it is behind and saying so in its log and to its
# administrators -- because an operator who pinned something in March to get
# past a bad afternoon should not discover in September that it stuck.
TELIUM_PIN=

# Why. Required whenever TELIUM_PIN is set.
#
# Not bureaucracy: the pin will outlive your memory of it and may well outlive
# your involvement with this machine. A one-line reason is the difference
# between the next person unpinning confidently and the next person leaving it
# alone forever because nobody knows what it was for. A pin with no reason is
# still honoured -- overriding an operator's explicit choice would be worse --
# but it is reported as an error on every single run until you write one.
TELIUM_PIN_REASON=


# Empty, or HH:MM-HH:MM local time.
#
# When set, the server container is only ever restarted inside this window. The
# check still runs every minute; it just waits. A window that wraps midnight is
# fine (22:00-04:00). This applies to every update including a security one --
# the whole promise of a maintenance window is that nothing surprises you
# outside it, and a promise with an exception is not one.
TELIUM_UPDATE_WINDOW=


# yes | no
#
# Whether a release may update /opt/telium/compose.yml.
#
# It only ever does so when the file is byte-identical to what the previous
# release shipped -- that is, when you have never edited it. The moment your
# copy differs from the shipped one, this stops writing to it entirely and
# reports the conflict instead. See "Configuration that ships with a release"
# in README.md.
#
# Setting this to `no` means a release that needs a compose change will not get
# one, and the server may then be running against infrastructure that no longer
# matches it. You will still be told what changed.
TELIUM_MANAGE_COMPOSE=yes


# ---- native installs (deploy/update-native.sh) -----------------------------
#
# The four fields above are read by both updaters and mean the same thing to
# each: a box runs one runtime, and "automatic or manual, pinned to what, and
# restarted when" is one set of answers regardless of how the server is
# packaged. The fields below belong to the native path alone -- where the
# binary lives, which unit restarts it, and which artifact a release should
# be fetched as. The container path ignores them, and a box with no such file
# gets exactly these defaults.

# Which installable artifact a release must publish for the native updater to
# act. Left empty here, the updater picks by the CPU it is running on --
# `server-linux-x86_64` on a VPS, `server-linux-aarch64` on a Raspberry Pi
# 3/4/5 -- which is the whole point: an operator answers nothing. Set it only
# to name an architecture the release list has never heard of, on a box that
# can run one anyway. docs/updates.md is where a third architecture is
# announced.
TELIUM_ARTIFACT=

# Where the server binary lives, and therefore what gets replaced. The
# previous generation is kept beside it as <name>.previous for a by-hand
# rollback -- see docs/upgrade.md for why that has one foot attached.
TELIUM_SERVER_BIN=/usr/local/bin/telium-server

# The server's own config. Read, never written: the updater's one rule about
# this file is the container updater's rule about telium.toml, and for the
# same reason -- every key has a default compiled in, so a release never
# needs to touch it.
TELIUM_CONFIG=/etc/telium/telium.toml

# The systemd unit restarted after a swap.
TELIUM_UNIT=telium-server.service

# The account the pre-install backup runs as, so the archive is owned by the
# account that will have to read and prune it. This is the user from
# telium-server.service's install notes.
TELIUM_SERVICE_USER=telium

# Empty, or a manifest URL overriding `updates.manifest_url` in telium.toml.
# Leave it empty: the server's config is the one place that names where
# releases are listed from, and having a second would make "which manifest
# does this box believe" a question with two answers.
TELIUM_MANIFEST_URL=
