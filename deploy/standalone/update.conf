# How this box updates itself. Installed at /opt/telium/update.conf and read by
# update.sh on every run. The same four fields mean the same thing to every
# Telium updater; see deploy/update.conf in the repository for the long version
# of each.

# automatic | manual
TELIUM_UPDATES=automatic

# Empty, or an exact image reference (or bare sha256: digest) to hold at.
TELIUM_PIN=

# Why. Required whenever TELIUM_PIN is set; a pin without one is honoured but
# reported as an error on every run until you write one.
TELIUM_PIN_REASON=

# Empty, or HH:MM-HH:MM local time. Restarts happen only inside it.
TELIUM_UPDATE_WINDOW=
