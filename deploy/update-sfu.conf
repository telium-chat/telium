# How this relay updates itself. Installed at /etc/telium/update-sfu.conf and
# read by update-sfu-native.sh (native installs) or update-sfu.sh (compose
# installs) on every run.
#
# The defaults below are the defaults in the scripts as well, so a box with no
# such file behaves exactly like a box with this one unedited. It is installed
# anyway, because a setting you can see is a setting you can change, and the
# most important line in this file is the first one: it says, in a field with
# a name, that this machine updates itself. An operator who wants something
# else has to write down what.
#
# Shell syntax -- the scripts source it. Keep it to KEY=value.


# automatic | manual
#
# `automatic` moves the relay to the newest release (draining live calls
# first). `manual` checks, stages what it found, and does nothing; you run
# `update-sfu-native.sh --now` (native) or `update-sfu.sh --now` (compose)
# when you are ready.
#
# Choose `manual` if you want to read release notes before every deploy. Be
# aware of what you are taking on: nothing else will apply a security fix for
# you, and the relay keeps counting the releases it is behind in its log and
# on its dashboard. That is the point -- staying behind should be a thing you
# keep deciding, not a thing that happens while you are busy.
TELIUM_SFU_UPDATES=automatic


# Native path only: a version ("0.2.0") or 40-hex commit to hold the relay at.
# The container path pins by digest instead -- see TELIUM_SFU_IMAGE in the
# compose section below.
#
# A pin is honoured but not quiet: while one is set, every run says so, and a
# pin with no reason is reported as an error on every single run until
# TELIUM_SFU_PIN_REASON says why. The pin will outlive your memory of it.
TELIUM_SFU_PIN=

# Why. Required whenever TELIUM_SFU_PIN is set.
TELIUM_SFU_PIN_REASON=


# Empty, or HH:MM-HH:MM local time.
#
# When set, the relay is only ever restarted inside this window. The check
# still runs; it just waits. A window that wraps midnight is fine (22:00-04:00).
# This applies to every update including a security one -- the whole promise of
# a maintenance window is that nothing surprises you outside it. Inside the
# window the relay is drained first: it stops taking new calls, live calls
# finish (up to TELIUM_SFU_DRAIN_TIMEOUT), and only then is it restarted.
TELIUM_SFU_UPDATE_WINDOW=

# How long a drain may hold new joins out while rooms empty before the update
# proceeds with calls still active. The relay's own updates.drain_max_secs is
# the safety net that resumes accepting if this script dies mid-wait; this is
# the plan. Live calls still open when the ceiling hits will drop, and clients
# will rejoin.
TELIUM_SFU_DRAIN_TIMEOUT=900


# ---- native installs (deploy/update-sfu-native.sh) -------------------------
#
# The fields above are read by both updaters and mean the same thing to each.
# The fields below belong to the native path alone -- where the binary lives,
# which unit restarts it, and which artifact a release should be fetched as.

# Which installable artifact a release must publish for the native updater to
# act. Left empty here, the updater picks by the CPU it is running on --
# `sfu-linux-x86_64` on a VPS, `sfu-linux-aarch64` on a Raspberry Pi -- which
# is the whole point: an operator answers nothing.
TELIUM_SFU_ARTIFACT=

# Where the relay binary lives, and therefore what gets replaced. The previous
# generation is kept beside it as <name>.previous for a by-hand rollback; the
# relay keeps no database, so the previous binary is a working undo.
TELIUM_SFU_BIN=/usr/local/bin/telium-sfu

# The relay's own config. Read, never written: the updater's one rule about
# this file is the container updater's rule about sfu.toml, and for the same
# reason -- every key has a default compiled in, so a release never needs to
# touch it.
TELIUM_SFU_CONFIG=/var/lib/telium-sfu/sfu.toml

# The systemd unit restarted after a swap.
TELIUM_SFU_UNIT=telium-sfu.service

# Where the relay's /health answers, used to watch the drain (rooms -> 0) and
# to notice a restart that came up unhealthy.
TELIUM_SFU_HEALTH_URL=http://127.0.0.1:7890/health

# Empty, or a manifest URL overriding `updates.manifest_url` in sfu.toml.
# Leave it empty: the relay's config is the one place that names where
# releases are listed from, and having a second would make "which manifest
# does this relay believe" a question with two answers.
TELIUM_SFU_MANIFEST_URL=
