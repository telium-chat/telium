[package]
name = "telium-desktop"
version = "0.1.0"
description = "Telium desktop client"
authors = ["Telium contributors"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "telium_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
base64 = "0.22"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Tauri's Linux webview is WebKitGTK.  Its default permission handler does not
# grant getUserMedia requests to an embedded app, so connect the handler after
# the webview is created and allow the app's voice capture requests.
webkit2gtk = "2"
